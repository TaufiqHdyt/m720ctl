[package]
name = "m720ctl"
version = "0.1.0"
edition = "2021"
description = "Minimal Logi Options replacement for an M720 on Apple Silicon: shift-scroll and button remapping via a CGEventTap"
license = "MIT"
publish = false

[dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
# new_scroll_event, used only by the scroll tests
core-graphics = { version = "0.25", features = ["highsierra"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
